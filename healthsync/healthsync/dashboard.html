<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Coach">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<title>Coach</title>
<style>
/* Layout: one calm column, summary first. Race-bib numerals (condensed) carry the
   numbers, Inter carries the words; one accent (track orange), semantic colors only for state. */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --sunk: #eceef1; --ink: #13171c; --muted: #6a7380; --line: #e1e4e8;
  --accent: #e4572e; --accent-soft: rgba(228, 87, 46, .12);
  --run: #e4572e; --bike: #3a6ea5; --strength: #6b5b95; --racket: #2a8c7a; --other: #9aa1ab;
  --good: #1f9d5a; --warn: #c98a0c; --bad: #d23c3c;
  --num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --text: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --radius: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1215; --surface: #171b20; --sunk: #1f242a; --ink: #eef1f4; --muted: #8b949f; --line: #262c33;
    --accent: #ff6b40; --accent-soft: rgba(255, 107, 64, .16);
    --run: #ff6b40; --bike: #6c9fd6; --strength: #9c8cc9; --racket: #4cb8a3; --other: #5d6670;
    --good: #3cc47c; --warn: #e5a92a; --bad: #f05a5a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1215; --surface: #171b20; --sunk: #1f242a; --ink: #eef1f4; --muted: #8b949f; --line: #262c33;
  --accent: #ff6b40; --accent-soft: rgba(255, 107, 64, .16);
  --run: #ff6b40; --bike: #6c9fd6; --strength: #9c8cc9; --racket: #4cb8a3; --other: #5d6670;
  --good: #3cc47c; --warn: #e5a92a; --bad: #f05a5a; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--text);
  padding-top: max(18px, env(safe-area-inset-top, 0px));
  padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 540px; margin: 0 auto; }
.tab { display: none; flex-direction: column; gap: 12px; }
.tab.on { display: flex; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--surface); border-radius: var(--radius); padding: 18px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.row { display: flex; align-items: center; gap: 12px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* header */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 2px 2px 6px; }
.top h1 { margin: 2px 0 0; font: 600 26px/1.15 var(--text); letter-spacing: -.02em; text-wrap: balance; }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; padding: 5px 11px 5px 9px; border-radius: 99px; background: var(--surface); white-space: nowrap; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.lead { margin: 0 2px 2px; font-size: 15.5px; color: var(--ink); max-width: 60ch; }
.iconbtn { border: 0; background: var(--surface); color: var(--muted); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
.iconbtn:focus-visible, nav button:focus-visible, .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* race */
.race-days { font: 700 96px/.82 var(--num); letter-spacing: -.01em; }
.race-days small { font: 600 22px var(--num); color: var(--muted); margin-left: 6px; letter-spacing: .02em; }
.race-target { text-align: right; }
.race-target .num { font-size: 40px; font-weight: 700; line-height: 1; display: block; }
.scale { position: relative; height: 96px; margin: 18px 4px 0; }
.scale .axis { position: absolute; left: 0; right: 0; top: 43px; height: 2px; background: var(--line); }
.scale .ticks { position: absolute; left: 0; right: 0; top: 39px; height: 10px;
  background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 10%); }
.scale .gap { position: absolute; top: 42px; height: 4px; background: var(--accent-soft); border-radius: 2px; }
.mark { position: absolute; top: 0; width: 0; height: 96px; }
.mark::before { content: ""; position: absolute; left: -1px; top: 35px; width: 2px; height: 18px; background: var(--ink); }
.mark span { position: absolute; transform: translateX(-50%); white-space: nowrap; text-align: center; font-size: 11px; color: var(--muted); line-height: 1.2; }
.mark span b { display: block; font: 600 16px var(--num); color: var(--ink); }
.mark.up span { top: 0; } .mark.down span { top: 60px; }
.mark.me::before { left: -6px; top: 38px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--surface); }
.mark.me span b { color: var(--accent); }
.prep { margin-top: 26px; }
.bar { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 3px; background: var(--accent); width: 0; transition: width 1s cubic-bezier(.2,.7,.2,1); }
.meta { display: flex; justify-content: space-between; gap: 10px; margin-top: 7px; font-size: 13px; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 600; }
.next-race { display: flex; justify-content: space-between; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13.5px; }

/* week */
.week { display: grid; grid-template-columns: 112px 1fr; gap: 18px; align-items: center; }
.ring circle { transition: stroke-dashoffset 1.1s cubic-bezier(.2,.7,.2,1); }
.goals { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.goal .meta { margin: 0 0 5px; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 18px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
.day .cell { width: 100%; aspect-ratio: 1; max-width: 44px; border-radius: 10px; background: var(--sunk); display: grid; place-items: center;
  font: 600 13px var(--num); color: var(--muted); }
.day .cell.planned { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.day .cell.done { color: #fff; }
.day.today { color: var(--ink); font-weight: 600; }
.day.today .cell { box-shadow: inset 0 0 0 1.5px var(--line), 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink); }

/* list rows */
.list { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 48px 1fr auto; gap: 2px 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: baseline; }
.item:first-child { border-top: 0; padding-top: 2px; }
.item .when { font: 600 15px var(--num); color: var(--muted); grid-row: span 2; line-height: 1.1; }
.item .when b { display: block; font-size: 22px; color: var(--ink); font-weight: 700; }
.item .what { font-weight: 600; }
.item .desc { grid-column: 2 / 4; font-size: 13px; color: var(--muted); }
.tag { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.today { background: var(--accent-soft); color: var(--accent); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

/* stats */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; }
.stat { min-width: 0; }
.stat .v { font: 700 30px/1 var(--num); margin: 4px 0 2px; }
.stat .v small { font: 500 14px var(--text); color: var(--muted); margin-left: 3px; }
.trend { font-size: 12px; font-weight: 600; }
.trend.good { color: var(--good); } .trend.bad { color: var(--bad); } .trend.flat { color: var(--muted); }
.streak-n { font: 700 56px/.9 var(--num); }
.weeks8 { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 14px; }
.weeks8 i { height: 6px; border-radius: 3px; background: var(--sunk); }
.weeks8 i.on { background: var(--accent); }
.flag { font-size: 13.5px; color: var(--bad); padding: 9px 0 0; }

/* milestones */
.ms-group + .ms-group { margin-top: 18px; }
.ms-title { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.ms { padding: 12px 0; border-top: 1px solid var(--line); }
.ms:first-of-type { border-top: 0; }
.ms .head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 7px; }
.ms .name { font-weight: 600; min-width: 0; }
.ms .val { font: 600 17px var(--num); white-space: nowrap; }
.ms .val small { font: 500 12px var(--text); color: var(--muted); }
.ms.got .name::after { content: "Erreicht"; margin-left: 8px; font-size: 11px; font-weight: 600; color: var(--good); }
.ms.got .bar > i { background: var(--good); }
.ms.next { position: relative; }
.ms.next .name { color: var(--ink); }
.ms .sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
.link { border: 0; background: none; padding: 12px 0 0; color: var(--accent); font: 600 14px var(--text); cursor: pointer; }

/* charts */
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--muted); font: 500 10.5px var(--text); }
svg .grid { stroke: var(--line); stroke-width: 1; }
.chart { position: relative; touch-action: pan-y; }
.tip { position: absolute; top: -4px; transform: translate(-50%, -100%); background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 600;
  padding: 4px 8px; border-radius: 6px; pointer-events: none; white-space: nowrap; opacity: 0; transition: opacity .12s; }
.kpis { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 14px; }
.kpis div { min-width: 0; }
.kpis .v { font: 700 30px/1 var(--num); }
.kpis .v small { font: 500 14px var(--text); color: var(--muted); margin-left: 2px; }
.records { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; }
.records div { background: var(--surface); padding: 12px 14px; }
.records .v { font: 700 26px/1.1 var(--num); margin: 3px 0 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.scroll-x { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 0 4px 8px; }
td { padding: 9px 4px; border-top: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
.note { font-size: 12.5px; color: var(--muted); margin: 12px 0 0; max-width: 62ch; }
.error { background: var(--surface); color: var(--bad); border-radius: 12px; padding: 12px 14px; font-size: 14px; }

/* tab bar */
nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--surface) 88%, transparent);
  border-top: 1px solid var(--line); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav .in { max-width: 540px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav button { border: 0; background: none; color: var(--muted); font: 500 11px var(--text); padding: 6px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; border-radius: 10px; }
nav button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
nav button.on { color: var(--accent); }
.foot { text-align: center; font-size: 12px; color: var(--muted); padding: 8px 0 4px; }
.foot button { border: 0; background: none; color: inherit; text-decoration: underline; font: inherit; cursor: pointer; }
@media (max-width: 360px) { .race-days { font-size: 80px; } .week { grid-template-columns: 92px 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.macro{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin-top:6px}
.macro i{display:block;height:100%}
.macro-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;color:var(--muted)}
.macro-legend b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<main id="app"><div class="panel muted">Lade Daten …</div></main>
<nav aria-label="Bereiche"><div class="in">
  <button data-t="heute" class="on"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg>Heute</button>
  <button data-t="ziele"><svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h11l-2 3.5L16 11H5"/></svg>Etappen</button>
  <button data-t="training"><svg viewBox="0 0 24 24"><path d="M4 20V13M10 20V8M16 20v-9M22 20H2"/></svg>Training</button>
  <button data-t="erholung"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>Erholung</button>
  <button data-t="koerper"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 9.5a4 4 0 0 1 6 0M12 9.5 13.5 8"/></svg>Körper</button>
</div></nav>
<script>
const SP = { running: ["Lauf", "var(--run)", "L"], cycling: ["Rad", "var(--bike)", "R"], strength: ["Kraft", "var(--strength)", "K"],
  racket: ["Badminton", "var(--racket)", "B"], walking: ["Gehen", "var(--other)", "G"], other: ["Sonstiges", "var(--other)", "S"] };
const STATE = { "grün": ["var(--good)", "Bereit", "Training wie geplant."], "gelb": ["var(--warn)", "Vorsicht", "Einheit machen, aber locker halten."],
  "rot": ["var(--bad)", "Erholen", "Heute locker oder Pause, Qualität verschieben."], "grau": ["var(--muted)", "Keine Daten", "Uhr synchronisieren."] };
const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const D_ = s => new Date(s + "T12:00:00");
const dd = s => `${D_(s).getDate()}.${D_(s).getMonth() + 1}.`;
const wdd = s => `${WD[D_(s).getDay()]} ${dd(s)}`;
const nf = (v, k = 0) => v == null ? "–" : Number(v).toLocaleString("de-DE", { maximumFractionDigits: k, minimumFractionDigits: k });
const hm = m => m == null ? "–" : `${Math.floor(m / 60)}:${String(Math.round(m % 60)).padStart(2, "0")}`;
const secs = t => t ? String(t).split(":").reduce((a, b) => a * 60 + +b, 0) : null;
const fmtS = s => { s = Math.round(Math.abs(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? `${h}:${String(m).padStart(2, "0")}` : m) + ":" + String(x).padStart(2, "0"); };
const daysTo = (a, b) => Math.round((D_(a) - D_(b)) / 864e5);
const bar = (f, color) => `<div class="bar"><i data-w="${Math.max(0, Math.min(1, f)) * 100}"${color ? ` style="background:${color}"` : ""}></i></div>`;
const count = (v, k = 0) => v == null ? "–" : `<span data-count="${v}" data-k="${k}">${nf(v, k)}</span>`;

function greeting() { const h = new Date().getHours(); return h < 11 ? "Guten Morgen" : h < 18 ? "Hallo" : "Guten Abend"; }

function lead(D) {
  const w = D.week, left = Math.max(0, w.planned - w.done), race = D.races[0];
  const todo = D.today_plan.filter(p => p.status !== "done");
  if (D.ampel === "rot") return "Dein Körper braucht heute Erholung. Die geplante Einheit kann warten.";
  if (todo.length) return `Heute: ${todo.map(p => esc(p.name)).join(" und ")}.`;
  if (w.planned && !left) return "Alle Einheiten dieser Woche erledigt.";
  if (w.planned && left <= 2) return `Noch ${left} ${left === 1 ? "Einheit" : "Einheiten"}, dann ist die Woche komplett.`;
  if (D.streak_weeks >= 2) return `${D.streak_weeks} Wochen in Folge geschafft. Diese Woche zählt auch.`;
  if (race) return `Heute frei. Noch ${race.days_left} Tage bis zum ${esc(race.name)}.`;
  return "Heute frei.";
}

/* ---------- drawing ---------- */
function ring(frac, label, sub) {
  const r = 46, C = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac));
  return `<svg class="ring" viewBox="0 0 112 112" role="img" aria-label="${esc(label)} ${esc(sub)}">
    <circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="9"/>
    <circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C}" data-to="${C * (1 - f)}" transform="rotate(-90 56 56)"/>
    <text x="56" y="60" text-anchor="middle" style="font:700 30px var(--num);fill:var(--ink)">${esc(label)}</text>
    <text x="56" y="77" text-anchor="middle">${esc(sub)}</text></svg>`;
}

function spark(series, color) {
  const W = 120, H = 30, pts = series.map((p, i) => [i, p[1]]).filter(p => p[1] != null);
  if (pts.length < 2) return "";
  const v = pts.map(p => p[1]), lo = Math.min(...v), hi = Math.max(...v) || 1, n = series.length - 1;
  const x = i => i / n * W, y = q => H - 2 - (q - lo) / ((hi - lo) || 1) * (H - 4);
  const d = pts.map((p, j) => `${j ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const l = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:30px;margin-top:6px"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(l[0])}" cy="${y(l[1])}" r="2.5" fill="${color}"/></svg>`;
}

function area(series, o = {}) {
  const W = 340, H = o.h || 130, L = 28, R = 6, id = "a" + Math.random().toString(36).slice(2, 7);
  const pts = series.map((p, i) => [i, p[1]]).filter(p => p[1] != null);
  if (pts.length < 2) return `<p class="muted small">Noch zu wenig Daten für einen Verlauf.</p>`;
  const line = o.trend ? o.trend.map((p, i) => [i, p[1]]).filter(p => p[1] != null) : pts;
  const all = pts.map(p => p[1]).concat(line.map(p => p[1]), (o.band || []).filter(v => v != null));
  let lo = Math.min(...all), hi = Math.max(...all); if (hi - lo < 1e-6) { lo -= 1; hi += 1; }
  const step = niceStep((hi - lo) / 3); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const n = series.length - 1, x = i => L + i * (W - L - R) / n, y = v => 6 + (hi - v) * (H - 12) / (hi - lo);
  const d = line.map((p, j) => { const X = x(p[0]), Y = y(p[1]); if (!j) return `M${X},${Y}`;
    const q = line[j - 1], m = (x(q[0]) + X) / 2; return `C${m},${y(q[1])} ${m},${Y} ${X},${Y}`; }).join("");
  const c = o.color || "var(--accent)";
  let grid = "";
  for (let v = lo; v <= hi + 1e-9; v += step) grid += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${o.fmt === "hm" ? hm(v) : nf(v, step < 1 ? 1 : 0)}</text>`;
  const band = o.band && o.band[0] != null && o.band[1] != null
    ? `<rect x="${L}" width="${W - L - R}" y="${y(Math.min(o.band[1], hi))}" height="${Math.max(0, y(Math.max(o.band[0], lo)) - y(Math.min(o.band[1], hi)))}" fill="var(--good)" opacity=".1"/>` : "";
  const dots = o.trend ? pts.map(p => `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="2" fill="${c}" opacity=".35"/>`).join("") : "";
  const last = line[line.length - 1];
  const data = series.map((p, i) => [p[0], p[1], o.trend ? o.trend[i][1] : null]);
  return `<div class="chart" data-s='${esc(JSON.stringify(data))}' data-lo="${lo}" data-hi="${hi}" data-h="${H}" data-l="${L}" data-r="${R}" data-fmt="${o.fmt || ""}">
    <div class="tip"></div><svg viewBox="0 0 ${W} ${H + 18}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".22"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
    ${grid}${band}${dots}
    <path d="${d}L${x(last[0])},${H - 6}L${x(line[0][0])},${H - 6}Z" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="${x(last[0])}" cy="${y(last[1])}" r="4" fill="${c}" stroke="var(--surface)" stroke-width="2"/>
    <line class="cur" y1="6" y2="${H - 6}" stroke="var(--muted)" stroke-dasharray="3 3" style="display:none"/>
    <circle class="curdot" r="4" fill="var(--ink)" style="display:none"/>
    <text x="${L}" y="${H + 14}">${dd(series[0][0])}</text><text x="${W - R}" y="${H + 14}" text-anchor="end">${dd(series[n][0])}</text></svg></div>`;
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function bindCharts(root) {
  root.querySelectorAll(".chart").forEach(ch => {
    const s = JSON.parse(ch.dataset.s), lo = +ch.dataset.lo, hi = +ch.dataset.hi, H = +ch.dataset.h, L = +ch.dataset.l, R = +ch.dataset.r, fmt = ch.dataset.fmt;
    const svg = ch.querySelector("svg"), tip = ch.querySelector(".tip"), cur = svg.querySelector(".cur"), dot = svg.querySelector(".curdot");
    const show = e => {
      const r = svg.getBoundingClientRect(), px = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) / r.width * 340;
      const n = s.length - 1, i = Math.max(0, Math.min(n, Math.round((px - L) / (340 - L - R) * n))), v = s[i][2] ?? s[i][1];
      if (v == null) return;
      const X = L + i * (340 - L - R) / n, Y = 6 + (hi - v) * (H - 12) / (hi - lo);
      cur.setAttribute("x1", X); cur.setAttribute("x2", X); cur.style.display = ""; dot.setAttribute("cx", X); dot.setAttribute("cy", Y); dot.style.display = "";
      tip.style.left = X / 340 * 100 + "%"; tip.style.top = Y / (H + 18) * 100 + "%"; tip.style.opacity = 1;
      tip.textContent = `${wdd(s[i][0])} · ${fmt === "hm" ? hm(v) + " h" : nf(v, fmt === "1" ? 1 : 0)}`;
    };
    const hide = () => { tip.style.opacity = 0; cur.style.display = "none"; dot.style.display = "none"; };
    ch.addEventListener("pointermove", show); ch.addEventListener("pointerdown", show);
    ch.addEventListener("pointerleave", hide); ch.addEventListener("touchend", () => setTimeout(hide, 1600));
  });
}

function columns(weeks, key, color, avg, unit) {
  const W = 340, H = 130, n = weeks.length, bw = Math.min((W - 8) / n, 34), L = W - 4 - bw * n;
  const max = Math.max(1, ...weeks.map(w => w[key]), avg || 0) * 1.15, y = v => H - v / max * H;
  let s = `<svg viewBox="0 0 ${W} ${H + 18}" role="img" aria-label="${esc(unit)} pro Woche">`;
  weeks.forEach((w, i) => { const X = L + i * bw, v = w[key];
    s += `<rect x="${X + 4}" y="${y(v)}" width="${bw - 8}" height="${H - y(v)}" rx="3" fill="${w.current ? color : "var(--sunk)"}" ${w.current ? "" : `style="fill:color-mix(in srgb, ${color} 38%, var(--sunk))"`}/>`;
    if (v) s += `<text x="${X + bw / 2}" y="${y(v) - 5}" text-anchor="middle" style="${w.current ? "fill:var(--ink);font-weight:600" : ""}">${nf(v)}</text>`;
    if ((n - 1 - i) % 3 === 0) s += `<text x="${X + bw / 2}" y="${H + 14}" text-anchor="middle">${dd(w.start)}</text>`; });
  if (avg) s += `<line x1="${L}" x2="${W - L}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--ink)" stroke-opacity=".5" stroke-dasharray="3 4"/>`;
  return s + "</svg>";
}

function heatmap(entries, today) {
  const end = D_(today), start = new Date(end); start.setDate(start.getDate() - ((end.getDay() + 6) % 7) - 7 * 11);
  const by = {}; entries.forEach(([day, sport, km, min]) => (by[day] = by[day] || []).push({ sport, min }));
  const cell = 22, gap = 4, W = 22 + 12 * (cell + gap);
  let s = `<svg viewBox="0 0 ${W} ${7 * (cell + gap)}" role="img" aria-label="Aktivitäten der letzten 12 Wochen">`;
  ["Mo", "", "Mi", "", "Fr", "", "So"].forEach((t, r) => s += `<text x="0" y="${r * (cell + gap) + 15}">${t}</text>`);
  for (let c = 0; c < 12; c++) for (let r = 0; r < 7; r++) {
    const day = new Date(start); day.setDate(start.getDate() + c * 7 + r); if (day > end) continue;
    const iso = `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, "0")}-${String(day.getDate()).padStart(2, "0")}`;
    const a = (by[iso] || []).filter(x => x.sport !== "walking").sort((p, q) => q.min - p.min), m = a[0];
    s += `<rect x="${22 + c * (cell + gap)}" y="${r * (cell + gap)}" width="${cell}" height="${cell}" rx="5" fill="${m ? SP[m.sport][1] : "var(--sunk)"}"
      ${iso === today ? 'stroke="var(--ink)" stroke-width="1.5"' : ""}><title>${wdd(iso)}: ${a.map(x => SP[x.sport][0] + " " + Math.round(x.min) + " min").join(", ") || "frei"}</title></rect>`;
  }
  return s + "</svg>";
}

/* ---------- views ---------- */
function raceScale(race) {
  const tgt = secs(race.target), prev = secs(race.previous), pred = race.prediction ? race.prediction.sec : null;
  const vals = [tgt, prev, pred].filter(Boolean), lo = Math.min(...vals, tgt * .97), hi = Math.max(...vals, tgt * 1.08);
  const pos = v => (hi - v) / (hi - lo) * 100;  // faster = further right
  let s = `<div class="scale"><div class="axis"></div><div class="ticks"></div>`;
  if (pred && pred > tgt) s += `<div class="gap" style="left:${pos(pred)}%;width:${pos(tgt) - pos(pred)}%"></div>`;
  s += `<div class="mark up" style="left:${pos(tgt)}%"><span><b>${race.target}</b>Ziel${prev === tgt ? " = Vorjahr" : ""}</span></div>`;
  if (prev && prev !== tgt) s += `<div class="mark down" style="left:${pos(prev)}%"><span><b>${fmtS(prev)}</b>Vorjahr</span></div>`;
  if (pred) s += `<div class="mark me down" style="left:${pos(pred)}%"><span><b>${race.prediction.time}</b>Prognose</span></div>`;
  return s + `</div>`;
}

    <div class="stats">${stat("hrv_last_night", "ms", "var(--racket)")}${stat("resting_hr", "bpm", "var(--bad)")}${stat("sleep_min", "h", "var(--strength)", hm)}${stat("body_battery_high", "", "var(--bike)")}</div>

function milestones(D, full) {
  const M = D.milestones || []; if (!M.length) return "";
  const color = { Laufen: "var(--run)", Kraft: "var(--strength)", "Körper": "var(--racket)" };
  const order = ["Laufen", "Kraft", "Körper"], done = M.filter(m => m.achieved).length;
  const groups = [...new Set(M.map(m => m.group))].sort((a, b) => ((order.indexOf(a) + 1) || 9) - ((order.indexOf(b) + 1) || 9));
  const val = v => v == null ? "–" : typeof v === "number" ? nf(v, v % 1 ? 1 : 0) : esc(v);
  let h = `<section class="panel"><div class="panel-head"><span class="label">Etappenziele</span><span class="small muted">${done} von ${M.length} erreicht</span></div>`;
  h += groups.map(g => { let items = M.filter(m => m.group === g); const next = items.find(m => !m.achieved);
    if (!full) items = next ? [next] : items.slice(-1);
    return `<div class="ms-group"><div class="ms-title"><span class="dot" style="background:${color[g] || "var(--other)"}"></span><b class="small">${esc(g)}</b></div>` +
      items.map(m => { const dl = m.due ? daysTo(m.due, D.today) : null;
        return `<div class="ms${m.achieved ? " got" : m === next ? " next" : ""}"><div class="head"><span class="name">${esc(m.title)}</span>
          <span class="val">${val(m.current)}<small> / ${val(m.target)} ${esc(m.unit || "")}</small></span></div>
          ${bar(m.progress, m.achieved ? null : color[g])}
          <div class="sub">${m.due ? `bis ${dd(m.due)}${dl >= 0 && !m.achieved ? ` · noch ${dl} Tage` : ""}` : ""}${m.baseline != null ? ` · Start ${val(m.baseline)}` : ""}${m.note ? ` · ${esc(m.note)}` : ""}</div></div>`; }).join("") + `</div>`; }).join("");
  if (!full) h += `<button class="link" data-go="ziele">Alle ${M.length} Etappen</button>`;
  return h + `</section>`;
}

}

function dayCols(series, target, color, unit) {
  const W = 340, H = 110, n = series.length, bw = (W - 30) / n, L = 30;
  const max = Math.max(1, ...series.map(p => p[1] || 0), target || 0) * 1.12, y = v => H - v / max * H;
  let s = `<svg viewBox="0 0 ${W} ${H + 18}" role="img" aria-label="${esc(unit)} pro Tag">`;
  series.forEach(([d, v], i) => { const X = L + i * bw;
    if (v) s += `<rect x="${X + 1}" y="${y(v)}" width="${Math.max(1, bw - 2)}" height="${H - y(v)}" rx="2" fill="${color}" opacity="${target && v >= target ? 1 : .45}"><title>${wdd(d)}: ${nf(v)} ${unit}</title></rect>`;
    else s += `<rect x="${X + 1}" y="${H - 2}" width="${Math.max(1, bw - 2)}" height="2" rx="1" fill="var(--sunk)"/>`;
    if ((n - 1 - i) % 7 === 0) s += `<text x="${X + bw / 2}" y="${H + 14}" text-anchor="middle">${dd(d)}</text>`; });
  if (target) s += `<line x1="${L}" x2="${W}" y1="${y(target)}" y2="${y(target)}" stroke="var(--ink)" stroke-opacity=".55" stroke-dasharray="3 4"/>
    <text x="${L - 4}" y="${y(target) + 3.5}" text-anchor="end">${nf(target)}</text>`;
  return s + "</svg>";
}

function nutrition(B) {
  const N = B.nutrition || {}, A = N.avg_7d || {}, S = N.series || {}, M = N.macro_pct, T = B.protein_target;
  const p7 = A.protein_g ?? B.protein_7d, pr = T && p7 != null ? p7 / T : 0;
  const hit = (S.protein_g || []).filter(p => p[1] && T && p[1] >= T).length;
  const stale = !N.logged_7d;
  const head = `<section class="panel"><div class="panel-head"><span class="label">Ernährung</span><span class="small muted">Yazio · Ø Tage mit Eintrag</span></div>`;
  if (!N.logged_28d) return head + `<p class="lead" style="margin:4px 0 0">Noch keine Yazio-Werte aus den letzten 4 Wochen.</p>
    <p class="note">${N.last_day ? `Letzter Eintrag: ${wdd(N.last_day)}.<br>` : ""}Trag Mahlzeiten in Yazio ein. Yazio schreibt sie in Apple Health, HealthFit exportiert sie ins Google Sheet und das Dashboard holt sie bei jedem Sync. Etwa 1,6 g Protein pro kg Körpergewicht reichen für den Muskelaufbau (Morton et al. 2018, BJSM 52:376).</p></section>`;
  const seg = M ? `<div class="macro">${[["protein_g", "Protein", "var(--racket)"], ["carbs_g", "Kohlenhydrate", "var(--bike)"], ["fat_g", "Fett", "var(--strength)"]]
      .map(([k, l, c]) => `<i style="width:${M[k]}%;background:${c}" title="${l} ${M[k]} %"></i>`).join("")}</div>
    <div class="macro-legend small">${[["protein_g", "Protein", "var(--racket)"], ["carbs_g", "Kohlenhydrate", "var(--bike)"], ["fat_g", "Fett", "var(--strength)"]]
      .map(([k, l, c]) => `<span><span class="dot" style="background:${c}"></span>${l} <b>${nf(A[k])} g</b> · ${M[k]} %</span>`).join("")}</div>` : "";
  return head + `
    <div class="kpis"><div><div class="v">${p7 != null ? count(p7) : "–"}<small>/ ${T ?? "–"} g</small></div><span class="small muted">Protein pro Tag</span></div>
      <div><div class="v" style="font-size:22px">${A.kcal_in ? nf(A.kcal_in) : "–"}<small>kcal</small></div><span class="small muted">pro Tag</span></div>
      <div><div class="v" style="font-size:22px">${N.logged_7d}<small>/ 7</small></div><span class="small muted">Tage erfasst</span></div></div>
    ${bar(pr, "var(--racket)")}
    <div class="panel-head" style="margin-top:16px"><span class="label">Protein pro Tag</span><span class="small muted">${hit} von ${N.logged_28d} Tagen am Ziel</span></div>
    ${dayCols(S.protein_g || [], T, "var(--racket)", "g")}
    ${seg ? `<div class="panel-head" style="margin-top:14px"><span class="label">Makros</span><span class="small muted">Anteil an den kcal, Ø 7 Tage</span></div>${seg}` : ""}
    <div class="panel-head" style="margin-top:14px"><span class="label">Kalorien pro Tag</span><span class="small muted">28 Tage</span></div>
    ${dayCols(S.kcal_in || [], null, "var(--accent)", "kcal")}
    <p class="note">${stale ? `Diese Woche noch kein Eintrag (letzter: ${wdd(N.last_day)}).<br>` : ""}Volle Balken: Tag mit mindestens ${T ?? "–"} g Protein. Etwa 1,6 g pro kg Körpergewicht reichen für den Muskelaufbau, mehr bringt im Schnitt kaum zusätzlich (Morton et al. 2018, BJSM 52:376). Für langsamen Aufbau reicht ein kleiner Überschuss von etwa 5–10 % über dem Bedarf (Iraki et al. 2019, Sports 7:154).</p></section>`;
}

/* ---------- app ---------- */
const VIEWS = { heute: vHeute, ziele: vZiele, training: vTraining, erholung: vErholung, koerper: vKoerper };
let DATA = null, TAB = (location.hash || "").slice(1);
if (!VIEWS[TAB]) { TAB = "heute"; try { TAB = localStorage.getItem("tab") || "heute"; } catch (e) {} if (!VIEWS[TAB]) TAB = "heute"; }
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

function render(D, stale) {
  DATA = D;
  document.getElementById("app").innerHTML = (stale ? `<div class="error">NAS nicht erreichbar. Du siehst den letzten Stand.</div>` : "") +
    Object.entries(VIEWS).map(([k, f]) => `<div class="tab" id="t-${k}">${f(D)}</div>`).join("") +
    `<div class="foot">Stand ${D.generated_at.replace("T", ", ")} Uhr · Daten bis ${D.latest_day ? wdd(D.latest_day) : "–"} · <button id="reload">Neu laden</button></div>`;
  show(TAB, true);
}
function show(k, first) {
  TAB = k; try { localStorage.setItem("tab", k); } catch (e) {}
  if (location.hash.slice(1) !== k) history.replaceState(null, "", "#" + k);
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.id === "t-" + k));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === k));
  const t = document.getElementById("t-" + k); if (!t) return;
  t.querySelectorAll("circle[data-to]").forEach(c => { c.style.transition = "none"; c.style.strokeDashoffset = c.getAttribute("stroke-dashoffset"); });
  t.querySelectorAll(".bar > i").forEach(i => { i.style.transition = "none"; i.style.width = 0; });
  t.getBoundingClientRect();
  requestAnimationFrame(() => {
    t.querySelectorAll("circle[data-to]").forEach(c => { c.style.transition = ""; c.style.strokeDashoffset = c.dataset.to; });
    t.querySelectorAll(".bar > i").forEach(i => { i.style.transition = ""; i.style.width = i.dataset.w + "%"; });
  });
  t.querySelectorAll("[data-count]").forEach(el => { const to = +el.dataset.count, kk = +el.dataset.k, t0 = performance.now();
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const step = now => { const p = Math.min(1, (now - t0) / 900); el.textContent = nf(to * (1 - Math.pow(1 - p, 3)), kk); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step); });
  if (!t.dataset.bound) { bindCharts(t); t.dataset.bound = 1; }
  if (!first) window.scrollTo({ top: 0 });
}
document.addEventListener("click", e => {
  const b = e.target.closest("nav button, [data-go]"); if (b && DATA) return show(b.dataset.t || b.dataset.go);
  if (e.target.closest("#reload")) return load();
  if (e.target.closest("#theme")) { const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("theme", r.dataset.theme); } catch (_) {} }
});
addEventListener("hashchange", () => { const k = location.hash.slice(1); if (VIEWS[k] && DATA && k !== TAB) show(k); });

async function load() {
  try {
    const r = await fetch("api/dashboard.json", { cache: "no-store" });
    if (!r.ok) throw new Error("Server antwortet mit " + r.status);
    const D = await r.json();
    try { localStorage.setItem("dash", JSON.stringify(D)); } catch (e) {}
    render(D);
  } catch (e) {
    let c = null; try { c = JSON.parse(localStorage.getItem("dash")); } catch (_) {}
    if (c) render(c, true);
    else document.getElementById("app").innerHTML = `<div class="error">NAS nicht erreichbar (${esc(e.message)}). Das Dashboard funktioniert nur im WLAN zu Hause.</div>`;
  }
}
load();
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
