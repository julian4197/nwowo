<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="theme-color" content="#0b0b10">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Coach</title>
<style>
:root {
  --bg: #0b0b10; --bg2: #14141c; --card: rgba(255,255,255,.055); --card-hi: rgba(255,255,255,.09);
  --ink: #f6f5fb; --muted: #8e8da0; --line: rgba(255,255,255,.08);
  --run: #ff6b3d; --run2: #ffb03d; --bike: #3da5ff; --bike2: #6ee7ff;
  --strength: #b46bff; --strength2: #ff6bd6; --racket: #2ee6a6; --other: #6b6a7a;
  --green: #35e08a; --yellow: #ffc83d; --red: #ff4d5e;
  --glow: 0 0 24px;
  --r: 22px;
}
:root[data-theme="light"] {
  --bg: #f3f2f8; --bg2: #ffffff; --card: #ffffff; --card-hi: #f7f6fb;
  --ink: #15141c; --muted: #6f6e80; --line: rgba(20,20,40,.08);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  padding: max(14px, env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom));
  min-height: 100vh; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: -20% -20% auto; height: 70vh; z-index: -1; pointer-events: none;
  background: radial-gradient(60% 50% at 20% 10%, rgba(255,107,61,.22), transparent 70%),
              radial-gradient(50% 45% at 90% 0%, rgba(180,107,255,.20), transparent 70%); }
:root[data-theme="light"] body::before { opacity: .5; }
main { max-width: 560px; margin: 0 auto; }
.tab { display: none; gap: 14px; }
.tab.on { display: grid; animation: tabin .35s ease both; }
@keyframes tabin { from { opacity: 0; transform: translateY(8px); } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); position: relative; overflow: hidden;
  opacity: 0; transform: translateY(14px); animation: up .55s cubic-bezier(.2,.8,.2,1) forwards; }
.tab.on .card:nth-child(2) { animation-delay: .06s } .tab.on .card:nth-child(3) { animation-delay: .12s }
.tab.on .card:nth-child(4) { animation-delay: .18s } .tab.on .card:nth-child(5) { animation-delay: .24s }
.tab.on .card:nth-child(6) { animation-delay: .30s } .tab.on .card:nth-child(n+7) { animation-delay: .36s }
@keyframes up { to { opacity: 1; transform: none; } }
.lbl { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
.muted { color: var(--muted); font-size: 14px; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.row { display: flex; align-items: center; gap: 12px; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid2 > .card { margin: 0; }

/* header */
.hdr { display: flex; justify-content: space-between; align-items: flex-end; padding: 4px 2px 2px; }
.hdr h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.hdr .date { color: var(--muted); font-size: 14px; font-weight: 600; }
.motto { margin: 2px 2px 0; font-size: 17px; font-weight: 600; line-height: 1.35;
  background: linear-gradient(90deg, var(--run2), var(--run) 40%, var(--strength2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.theme { background: var(--card); border: 1px solid var(--line); color: var(--ink); border-radius: 99px; width: 36px; height: 36px; font-size: 16px; }

/* hero */
.hero { padding: 22px 20px 20px; background: linear-gradient(145deg, rgba(255,107,61,.20), rgba(180,107,255,.14) 60%, var(--card)); }
.hero .race { font-size: 15px; font-weight: 700; }
.cd { font-size: 84px; font-weight: 850; line-height: .9; letter-spacing: -.04em;
  background: linear-gradient(180deg, #fff, #ffd2bf); -webkit-background-clip: text; background-clip: text; color: transparent; }
:root[data-theme="light"] .cd { background: linear-gradient(180deg, #2a1a40, #ff6b3d); -webkit-background-clip: text; background-clip: text; }
.cd small { font-size: 18px; font-weight: 700; letter-spacing: 0; -webkit-text-fill-color: var(--muted); margin-left: 6px; }
.target { text-align: right; }
.target b { font-size: 30px; font-weight: 800; letter-spacing: -.02em; display: block; }
.track { position: relative; height: 10px; border-radius: 99px; background: var(--line); margin: 18px 0 8px; overflow: hidden; }
.track i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px;
  background: linear-gradient(90deg, var(--run2), var(--run), var(--strength2)); transition: width 1.4s cubic-bezier(.2,.8,.2,1); box-shadow: var(--glow) rgba(255,107,61,.6); }
.timeline { position: relative; height: 86px; margin-top: 10px; }
.timeline .bar { position: absolute; left: 0; right: 0; top: 36px; height: 4px; border-radius: 4px;
  background: linear-gradient(90deg, var(--red), var(--yellow) 55%, var(--green)); opacity: .85; }
.timeline .pin { position: absolute; top: 0; width: 0; height: 86px; transition: left 1.4s cubic-bezier(.2,.8,.2,1); }
.timeline .pin::after { content: ""; position: absolute; top: 32px; left: -6px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px var(--bg); }
.timeline .pin.me::after { top: 29px; left: -9px; width: 18px; height: 18px; background: var(--run); box-shadow: 0 0 0 3px var(--bg), var(--glow) var(--run); animation: pulse 2s infinite; }
.timeline .lab { position: absolute; top: 0; left: 0; transform: translateX(-50%); text-align: center; font-size: 11px; color: var(--muted); white-space: nowrap; line-height: 1.25; }
.timeline .me .lab { top: 54px; }
.timeline .lab b { color: var(--ink); display: block; font-size: 13px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px var(--bg), 0 0 4px var(--run); } }

/* rings */
.rings { display: grid; grid-template-columns: 150px 1fr; gap: 16px; align-items: center; }
.rings svg circle { transition: stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1); }
.leg { display: grid; gap: 10px; }
.leg div { display: grid; grid-template-columns: 10px 1fr; column-gap: 10px; }
.leg span { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; }
.leg b { font-size: 20px; font-weight: 800; }
.leg small { grid-column: 2; color: var(--muted); font-size: 12px; margin-top: -2px; }

/* days strip */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 16px; }
.day { text-align: center; font-size: 11px; color: var(--muted); }
.day .b { height: 54px; border-radius: 12px; background: var(--line); margin-top: 4px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; position: relative; }
.day .b i { display: block; height: 0; transition: height 1s cubic-bezier(.2,.8,.2,1); }
.day .b em { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-size: 15px; }
.day.today { color: var(--ink); font-weight: 800; }
.day.today .b { outline: 2px solid var(--ink); outline-offset: 1px; }

/* readiness + streak */
.gauge text { font-weight: 800; }
.flame { font-size: 46px; line-height: 1; filter: drop-shadow(0 0 14px rgba(255,140,60,.7)); animation: flick 2.4s ease-in-out infinite; display: inline-block; }
@keyframes flick { 50% { transform: scale(1.08) rotate(-3deg); } }
.big { font-size: 44px; font-weight: 850; letter-spacing: -.03em; line-height: 1; }
.dots { display: flex; gap: 5px; margin-top: 12px; }
.dots i { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
.dots i.on { background: linear-gradient(90deg, var(--run2), var(--run)); box-shadow: 0 0 8px rgba(255,107,61,.5); }

/* sessions */
.scroller { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -18px; padding: 2px 18px 4px; scrollbar-width: none; }
.scroller::-webkit-scrollbar { display: none; }
.sess { flex: 0 0 78%; scroll-snap-align: start; border-radius: 18px; padding: 16px; color: #fff; position: relative; overflow: hidden; min-height: 132px; }
.sess .ic { font-size: 30px; }
.sess h3 { margin: 8px 0 2px; font-size: 18px; font-weight: 800; }
.sess p { margin: 0; font-size: 13px; opacity: .9; }
.sess .when { position: absolute; right: 14px; top: 14px; font-size: 12px; font-weight: 800; background: rgba(0,0,0,.22); padding: 3px 9px; border-radius: 99px; }
.g-running { background: linear-gradient(135deg, var(--run), #d93a6b); }
.g-cycling { background: linear-gradient(135deg, var(--bike), #5b4bff); }
.g-strength { background: linear-gradient(135deg, var(--strength), #ff4fa8); }
.g-racket { background: linear-gradient(135deg, var(--racket), #1a9fd6); }
.g-other { background: linear-gradient(135deg, #555, #333); }

/* badges */
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.badge { text-align: center; padding: 12px 6px 10px; border-radius: 16px; background: var(--card-hi); border: 1px solid var(--line); }
.badge .ico { width: 54px; height: 54px; margin: 0 auto 6px; display: grid; place-items: center; position: relative; font-size: 24px; }
.badge .ico svg { position: absolute; inset: 0; }
.badge.lock .ico span { filter: grayscale(1); opacity: .45; }
.badge.got { background: linear-gradient(160deg, rgba(255,200,61,.22), rgba(255,107,61,.10)); border-color: rgba(255,200,61,.35); }
.badge.got .ico span { filter: drop-shadow(0 0 8px rgba(255,200,61,.8)); }
.badge b { display: block; font-size: 12px; line-height: 1.2; }
.badge small { color: var(--muted); font-size: 11px; }

/* milestones */
.ms-group { margin-top: 14px; } .ms-group:first-of-type { margin-top: 0; }
.ms-group h4 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 700; }
.ms { display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.ms:first-of-type { border-top: 0; }
.ms .mi { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-size: 17px; grid-row: span 2; background: var(--card-hi); }
.ms.got .mi { background: linear-gradient(135deg, var(--yellow), var(--run)); box-shadow: 0 0 14px rgba(255,200,61,.5); }
.ms.next .mi { box-shadow: 0 0 0 2px var(--run); }
.ms b { font-size: 15px; } .ms .v { font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap; }
.more { margin-top: 12px; width: 100%; border: 0; border-radius: 12px; padding: 11px; background: var(--card-hi); color: var(--ink); font: 600 14px inherit; }
.ms .pb { grid-column: 2 / 4; height: 7px; border-radius: 99px; background: var(--line); overflow: hidden; }
.ms .pb i { display: block; height: 100%; width: 0; border-radius: 99px; transition: width 1.3s cubic-bezier(.2,.8,.2,1); }
/* charts */
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--muted); font-size: 10px; font-family: inherit; }
.chart { position: relative; touch-action: pan-y; }
.tip { position: absolute; top: -6px; transform: translateX(-50%); background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 700;
  padding: 4px 8px; border-radius: 8px; pointer-events: none; white-space: nowrap; opacity: 0; transition: opacity .15s; }
.draw { stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: draw 1.6s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.fade { opacity: 0; animation: fadein 1s .5s forwards; } @keyframes fadein { to { opacity: 1; } }
.grow { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: grow .8s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes grow { to { transform: scaleY(1); } }
.kpi { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; }
.kpi div b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.kpi div small { color: var(--muted); font-size: 12px; }
.delta { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 99px; }
.up { color: var(--green); background: rgba(53,224,138,.12); } .dn { color: var(--red); background: rgba(255,77,94,.12); }
.recs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rec { background: var(--card-hi); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.rec b { display: block; font-size: 22px; font-weight: 850; letter-spacing: -.02em; }
.rec small { color: var(--muted); font-size: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { padding: 9px 4px; border-top: 1px solid var(--line); text-align: right; }
th { color: var(--muted); font-weight: 600; font-size: 11px; border-top: 0; text-transform: uppercase; letter-spacing: .05em; }
td:first-child, th:first-child { text-align: left; }
.pl { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.pl:first-of-type { border-top: 0; }
.st { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; flex: none; font-weight: 800; }
.note { color: var(--muted); font-size: 12.5px; line-height: 1.5; margin: 12px 0 0; }
.flag { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255,77,94,.12); color: var(--red); font-size: 14px; font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; background: var(--c); }
.err { padding: 14px; border-radius: 14px; background: rgba(255,77,94,.12); color: var(--red); font-size: 14px; margin-bottom: 12px; }

/* tab bar */
nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 10;
  display: flex; gap: 4px; padding: 6px; border-radius: 99px; background: rgba(28,28,38,.72); border: 1px solid rgba(255,255,255,.1);
  backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); box-shadow: 0 10px 40px rgba(0,0,0,.45); }
:root[data-theme="light"] nav { background: rgba(255,255,255,.8); border-color: rgba(0,0,0,.06); box-shadow: 0 10px 30px rgba(0,0,0,.12); }
nav button { border: 0; background: none; color: var(--muted); font: 600 11px/1 inherit; padding: 9px 8px; border-radius: 99px; display: grid; gap: 3px; justify-items: center; min-width: 60px; }
nav button span { font-size: 18px; filter: grayscale(1); opacity: .7; }
nav button.on { color: var(--ink); background: rgba(255,255,255,.1); }
:root[data-theme="light"] nav button.on { background: rgba(0,0,0,.06); }
nav button.on span { filter: none; opacity: 1; }
.foot { text-align: center; font-size: 12px; color: var(--muted); padding: 6px 0 0; }
.foot a { color: inherit; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .card { opacity: 1; transform: none; } .draw { stroke-dashoffset: 0; } .grow { transform: none; } .fade { opacity: 1; } }
</style>
</head>
<body>
<main id="app"><div class="card" style="opacity:1;transform:none">Lade Daten …</div></main>
<nav id="nav">
  <button data-t="heute" class="on"><span>⚡</span>Heute</button>
  <button data-t="ziele"><span>🎯</span>Etappen</button>
  <button data-t="training"><span>🏃</span>Training</button>
  <button data-t="erholung"><span>💤</span>Erholung</button>
  <button data-t="koerper"><span>💪</span>Körper</button>
</nav>
<script>
const SP = {
  running: { n: "Lauf", c: "var(--run)", c2: "var(--run2)", i: "🏃" },
  cycling: { n: "Rad", c: "var(--bike)", c2: "var(--bike2)", i: "🚴" },
  strength: { n: "Kraft", c: "var(--strength)", c2: "var(--strength2)", i: "💪" },
  racket: { n: "Badminton", c: "var(--racket)", c2: "var(--racket)", i: "🏸" },
  walking: { n: "Gehen", c: "var(--other)", c2: "var(--other)", i: "🚶" },
  other: { n: "Sonstiges", c: "var(--other)", c2: "var(--other)", i: "✨" },
};
const AMP = { "grün": ["var(--green)", "Bereit", "Grünes Licht: Einheit wie geplant."],
  "gelb": ["var(--yellow)", "Achtung", "Machen, aber locker halten."],
  "rot": ["var(--red)", "Erholen", "Heute locker oder Pause. Qualität verschieben."],
  "grau": ["var(--other)", "–", "Uhr synchronisieren, dann weiß ich mehr."] };
const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const D_ = s => new Date(s + "T12:00:00");
const dd = s => `${D_(s).getDate()}.${D_(s).getMonth() + 1}.`;
const wdd = s => `${WD[D_(s).getDay()]} ${dd(s)}`;
const nf = (v, k = 0) => v == null ? "–" : Number(v).toLocaleString("de-DE", { maximumFractionDigits: k, minimumFractionDigits: k });
const hm = m => m == null ? "–" : `${Math.floor(m / 60)}:${String(Math.round(m % 60)).padStart(2, "0")}`;
const secs = t => t ? t.split(":").reduce((a, b) => a * 60 + +b, 0) : null;
const fmtS = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? `${h}:${String(m).padStart(2, "0")}` : m) + ":" + String(x).padStart(2, "0"); };
let uid = 0;

function countUp(root) {
  root.querySelectorAll("[data-count]").forEach(el => {
    const to = +el.dataset.count, k = +(el.dataset.k || 0), t0 = performance.now(), dur = 1200;
    const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = nf(to * e, k); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
const cnt = (v, k = 0) => v == null ? "–" : `<span data-count="${v}" data-k="${k}">0</span>`;

function greeting() { const h = new Date().getHours(); return h < 11 ? "Guten Morgen" : h < 17 ? "Hallo" : h < 22 ? "Guten Abend" : "Gute Nacht"; }

function motto(D) {
  const w = D.week, left = Math.max(0, w.planned - w.done), race = D.races[0], tp = D.today_plan.filter(p => p.status !== "done");
  if (D.ampel === "rot") return "Dein Körper sagt heute: Erholung. Auch das ist Training.";
  if (tp.length) return `Heute steht ${tp.map(p => p.name).join(" und ")} an. ${race ? `Noch ${race.days_left} Tage bis ${race.name.split(" ")[0]}.` : ""} Los geht's!`;
  if (w.planned && left === 0) return "Perfekte Woche! Alles erledigt. Genau so entsteht Form.";
  if (w.planned && left <= 2) return `Nur noch ${left} ${left === 1 ? "Einheit" : "Einheiten"} bis zur perfekten Woche.`;
  if (D.streak_weeks >= 2) return `${D.streak_weeks} Wochen in Folge. Halte die Serie am Leben!`;
  if (race) return `Jeder Lauf bringt dich näher an ${race.target}. ${race.days_left} Tage.`;
  return "Kleine Schritte, jede Woche. Konstanz schlägt Motivation.";
}

/* ---------- chart helpers ---------- */
function ring(cx, r, w, frac, c1, c2, label) {
  const id = "g" + (uid++), C = 2 * Math.PI * r, f = Math.max(0, Math.min(frac, 1.5));
  const over = f > 1 ? `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${c1}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-to="${C * (1 - (f - 1))}" transform="rotate(-90 ${cx} ${cx})" style="filter:brightness(1.35)"/>` : "";
  return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c2}"/><stop offset="1" stop-color="${c1}"/></linearGradient></defs>
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${c1}" stroke-opacity=".16" stroke-width="${w}"/>
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${w}" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C}" data-to="${C * (1 - Math.min(f, 1)) + (f > 0 ? 0 : 0)}" transform="rotate(-90 ${cx} ${cx})"><title>${label}</title></circle>${over}`;
}
function animateRings(root) {
  requestAnimationFrame(() => requestAnimationFrame(() =>
    root.querySelectorAll("circle[data-to]").forEach(c => c.style.strokeDashoffset = c.dataset.to)));
}

function area(series, o = {}) {
  const W = 340, H = o.h || 120, P = 6, id = "a" + (uid++);
  const pts = series.map((p, i) => [i, p[1]]).filter(p => p[1] != null);
  if (pts.length < 2) return `<div class="muted">Noch zu wenig Daten.</div>`;
  const vals = pts.map(p => p[1]).concat((o.band || []).filter(v => v != null), (o.trend || []).map(p => p[1]).filter(v => v != null));
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi - lo < 1e-6) { lo--; hi++; }
  const pad = (hi - lo) * .15; lo -= pad; hi += pad;
  const n = series.length - 1, x = i => P + i * (W - 2 * P) / n, y = v => H - (v - lo) * (H - 8) / (hi - lo);
  const smooth = arr => arr.map((p, j) => { const X = x(p[0]), Y = y(p[1]);
    if (!j) return `M${X},${Y}`; const q = arr[j - 1], mx = (x(q[0]) + X) / 2; return `C${mx},${y(q[1])} ${mx},${Y} ${X},${Y}`; }).join("");
  const line = o.trend ? o.trend.map((p, i) => [i, p[1]]).filter(p => p[1] != null) : pts;
  const c = o.color || "var(--run)";
  let band = "";
  if (o.band && o.band[0] != null && o.band[1] != null)
    band = `<rect x="${P}" width="${W - 2 * P}" y="${y(o.band[1])}" height="${y(o.band[0]) - y(o.band[1])}" rx="6" fill="var(--green)" opacity=".10"/>
      <text x="${W - P}" y="${y(o.band[1]) - 4}" text-anchor="end" style="fill:var(--green)">Normalbereich</text>`;
  const dots = o.trend ? pts.map(p => `<circle class="fade" cx="${x(p[0])}" cy="${y(p[1])}" r="2.4" fill="${c}" opacity=".45"/>`).join("") : "";
  const last = line[line.length - 1];
  const data = JSON.stringify(series.map((p, i) => [p[0], p[1], o.trend ? o.trend[i][1] : null]));
  return `<div class="chart" data-series='${esc(data)}' data-lo="${lo}" data-hi="${hi}" data-h="${H}" data-fmt="${o.fmt || ""}"><div class="tip"></div>
    <svg viewBox="0 0 ${W} ${H + 16}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${c}" stop-opacity=".45"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
    ${band}${dots}
    <path class="fade" d="${smooth(line)}L${x(last[0])},${H}L${x(line[0][0])},${H}Z" fill="url(#${id})"/>
    <path class="draw" d="${smooth(line)}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" style="filter:drop-shadow(0 4px 10px ${c})"/>
    <circle class="fade" cx="${x(last[0])}" cy="${y(last[1])}" r="5" fill="${c}" stroke="var(--bg)" stroke-width="2"/>
    <line class="cur" x1="0" x2="0" y1="0" y2="${H}" stroke="var(--ink)" stroke-opacity=".35" stroke-dasharray="3 3" style="display:none"/>
    <circle class="curdot" r="5" fill="var(--ink)" style="display:none"/>
    <text x="${P}" y="${H + 14}">${dd(series[0][0])}</text><text x="${W - P}" y="${H + 14}" text-anchor="end">${dd(series[n][0])}</text></svg></div>`;
}
function bindCharts(root) {
  root.querySelectorAll(".chart").forEach(ch => {
    const s = JSON.parse(ch.dataset.series), lo = +ch.dataset.lo, hi = +ch.dataset.hi, H = +ch.dataset.h, fmt = ch.dataset.fmt;
    const svg = ch.querySelector("svg"), tip = ch.querySelector(".tip"), cur = svg.querySelector(".cur"), dot = svg.querySelector(".curdot");
    const show = e => {
      const r = svg.getBoundingClientRect(), px = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      const n = s.length - 1, i = Math.max(0, Math.min(n, Math.round((px / r.width * 340 - 6) / (328) * n)));
      const v = s[i][2] ?? s[i][1]; if (v == null) return;
      const X = 6 + i * 328 / n, Y = H - (v - lo) * (H - 8) / (hi - lo);
      cur.setAttribute("x1", X); cur.setAttribute("x2", X); cur.style.display = ""; dot.setAttribute("cx", X); dot.setAttribute("cy", Y); dot.style.display = "";
      tip.style.left = (X / 340 * 100) + "%"; tip.style.opacity = 1;
      tip.textContent = `${wdd(s[i][0])}: ${fmt === "hm" ? hm(v) + " h" : nf(v, fmt === "1" ? 1 : 0)}${s[i][2] != null && s[i][1] != null ? ` (Tag ${nf(s[i][1], 1)})` : ""}`;
    };
    const hide = () => { tip.style.opacity = 0; cur.style.display = "none"; dot.style.display = "none"; };
    ch.addEventListener("pointermove", show); ch.addEventListener("touchmove", show, { passive: true });
    ch.addEventListener("pointerleave", hide); ch.addEventListener("touchend", () => setTimeout(hide, 1500));
  });
}

function bars(weeks, key, c1, c2, avg) {
  const W = 340, H = 140, n = weeks.length, bw = (W - 10) / n, id = "b" + (uid++);
  const max = Math.max(1, ...weeks.map(w => w[key]), avg || 0) * 1.12;
  const y = v => H - v / max * H;
  let s = `<svg viewBox="0 0 ${W} ${H + 18}"><defs><linearGradient id="${id}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>`;
  weeks.forEach((w, i) => {
    const h = H - y(w[key]), X = 5 + i * bw;
    s += `<rect class="grow" style="animation-delay:${i * 45}ms" x="${X + 3}" y="${y(w[key])}" width="${bw - 6}" height="${Math.max(h, w[key] ? 3 : 0)}" rx="${Math.min(7, (bw - 6) / 2)}" fill="url(#${id})" opacity="${w.current ? 1 : .55}"/>`;
    if (w[key]) s += `<text class="fade" x="${X + bw / 2}" y="${y(w[key]) - 5}" text-anchor="middle" style="${w.current ? "fill:var(--ink);font-weight:800" : ""}">${nf(w[key])}</text>`;
    if (i % 3 === (n - 1) % 3) s += `<text x="${X + bw / 2}" y="${H + 14}" text-anchor="middle">${dd(w.start)}</text>`;
  });
  if (avg) s += `<line class="fade" x1="5" x2="${W - 5}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--ink)" stroke-opacity=".45" stroke-dasharray="4 4"/><text class="fade" x="${W - 5}" y="${y(avg) - 5}" text-anchor="end" style="fill:var(--ink)">Ø 4 Wo ${nf(avg, 1)}</text>`;
  return s + "</svg>";
}

function heatmap(entries, today) {
  const end = D_(today), start = new Date(end); start.setDate(start.getDate() - ((end.getDay() + 6) % 7) - 7 * 11);
  const by = {}; entries.forEach(([day, sport, km, min]) => (by[day] = by[day] || []).push({ sport, km, min }));
  const cell = 21, gap = 5, W = 12 * (cell + gap) + 22;
  let s = `<svg viewBox="0 0 ${W} ${7 * (cell + gap)}">`;
  ["Mo", "", "Mi", "", "Fr", "", "So"].forEach((t, r) => s += `<text x="0" y="${r * (cell + gap) + 15}">${t}</text>`);
  for (let c = 0; c < 12; c++) for (let r = 0; r < 7; r++) {
    const day = new Date(start); day.setDate(start.getDate() + c * 7 + r); if (day > end) continue;
    const iso = `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, "0")}-${String(day.getDate()).padStart(2, "0")}`;
    const a = (by[iso] || []).filter(x => x.sport !== "walking").sort((p, q) => q.min - p.min), m = a[0];
    const tot = a.reduce((t, x) => t + x.min, 0);
    s += `<rect class="fade" style="animation-delay:${(c * 7 + r) * 8}ms" x="${22 + c * (cell + gap)}" y="${r * (cell + gap)}" width="${cell}" height="${cell}" rx="6"
      fill="${m ? SP[m.sport].c : "var(--line)"}" opacity="${m ? Math.min(1, .5 + tot / 100) : 1}" ${iso === today ? 'stroke="var(--ink)" stroke-width="2"' : ""}>
      <title>${wdd(iso)}: ${a.map(x => SP[x.sport].n + " " + Math.round(x.min) + " min").join(", ") || "frei"}</title></rect>`;
  }
  return s + "</svg>";
}

function gauge(score, color) {
  const r = 52, C = Math.PI * r, f = score == null ? 0 : score / 100;
  return `<svg viewBox="0 0 130 78" style="max-width:150px;margin:0 auto">
    <path d="M13,70 A52,52 0 0 1 117,70" fill="none" stroke="var(--line)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="65" cy="70" r="${r}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C} ${2 * C}"
      stroke-dashoffset="${C}" data-to="${C * (1 - f)}" transform="rotate(180 65 70)" style="filter:drop-shadow(0 0 8px ${color})"/>
    <text x="65" y="64" text-anchor="middle" style="font-size:28px;fill:var(--ink)">${score ?? "–"}</text>
    <text x="65" y="77" text-anchor="middle">Readiness</text></svg>`;
}


function milestones(D, full) {
  const M = D.milestones || []; if (!M.length) return "";
  const groups = [...new Set(M.map(m => m.group))];
  const GC = { Kraft: ["var(--strength)", "var(--strength2)", "💪"], Laufen: ["var(--run)", "var(--run2)", "🏃"], "Körper": ["var(--racket)", "var(--bike2)", "⚖️"] };
  const done = M.filter(m => m.achieved).length;
  const val = v => v == null ? "–" : typeof v === "number" ? nf(v, v % 1 ? 1 : 0) : esc(v);
  const daysTo = d => d ? Math.round((D_(d) - D_(D.today)) / 864e5) : null;
  return `<section class="card"><div class="row between"><div class="lbl" style="margin:0">Etappenziele</div><div class="muted num">${done}/${M.length} erreicht</div></div><div style="margin-top:12px">` +
    groups.map(g => { const c = GC[g] || ["var(--racket)", "var(--bike2)", "🎯"];
      let items = M.filter(m => m.group === g); const next = items.find(m => !m.achieved);
      if (!full) { const i = Math.max(0, items.indexOf(next)); items = items.slice(Math.max(0, i - 1), i + 2); }
      return `<div class="ms-group"><h4>${c[2]} ${esc(g)}</h4>` + items.map(m => { const dl = daysTo(m.due);
        return `<div class="ms${m.achieved ? " got" : m === next ? " next" : ""}"><div class="mi">${m.achieved ? "✓" : esc(m.icon || c[2])}</div>
          <b>${esc(m.title)}</b><span class="v num">${m.achieved ? "geschafft 🎉" : `<b style="color:var(--ink)">${val(m.current)}</b> / ${val(m.target)} ${esc(m.unit || "")}`}</span>
          <div class="pb"><i data-w="${Math.max(m.progress * 100, m.progress ? 3 : 0)}" style="background:linear-gradient(90deg, ${c[1]}, ${c[0]})"></i></div>
          <small class="muted" style="grid-column:2/4;font-size:11.5px">${m.due ? `bis ${dd(m.due)}${dl != null && dl >= 0 && !m.achieved ? ` · noch ${dl} Tage` : ""}` : ""}${m.baseline != null ? ` · Start ${val(m.baseline)}` : ""}${m.note ? ` · ${esc(m.note)}` : ""}${m.source === "manual" && !m.history.length ? " · neuen Wert beim Coach melden" : ""}</small></div>`; }).join("") + `</div>`; }).join("") +
    (full ? "" : `<button class="more" onclick="activate('ziele')">Alle ${M.length} Etappen ansehen ›</button>`) + `</div></section>`;
}

function tZiele(D) {
  return `<header class="hdr"><h1>Etappen</h1></header>` + milestones(D, true) +
    `<p class="note" style="padding:0 4px">Der Balken zeigt den Weg vom Startwert bis zum Ziel. Läufe, Kraft-Einheiten und Gewicht zählen automatisch. Klimmzüge, Liegestütze und Gewichte trägst du beim Coach ein.</p>`;
}

/* ---------- tabs ---------- */
function tHeute(D) {
  const A = AMP[D.ampel] || AMP.grau, race = D.races[0], w = D.week;
  let h = `<header class="hdr"><div><div class="date">${wdd(D.today)}</div><h1>${greeting()}${D.name ? ", " + esc(D.name) : ""}</h1></div>
    <button class="theme" id="theme" aria-label="Hell/Dunkel">☾</button></header>
    <p class="motto">${esc(motto(D))}</p>`;

  if (race) {
    const tgt = secs(race.target), prev = secs(race.previous), pred = race.prediction ? race.prediction.sec : null;
    const lo = Math.min(tgt, pred || tgt) - 90, hi = Math.max(prev || 0, pred || 0, tgt * 1.06) + 90;
    const pos = v => 100 - (v - lo) / (hi - lo) * 100;
    const prep = race.plan_total ? race.plan_done / race.plan_total : 0;
    h += `<section class="card hero">
      <div class="row between"><div class="race">🏁 ${esc(race.name)}</div><div class="muted">${wdd(race.date)}</div></div>
      <div class="row between" style="align-items:flex-end;margin-top:10px">

      <div class="track"><i data-w="${Math.max(prep * 100, 2)}"></i></div>
      <div class="row between muted"><span>Vorbereitung</span><span class="num"><b style="color:var(--ink)">${race.plan_done}</b> von ${race.plan_total} Einheiten</span></div>
      <div class="timeline">
        <div class="bar"></div>
        ${prev && prev !== tgt ? `<div class="pin" style="left:${pos(prev)}%"><div class="lab"><b>${fmtS(prev)}</b>Vorjahr</div></div>` : ""}
        <div class="pin" style="left:${pos(tgt)}%"><div class="lab"><b>${race.target}</b>Ziel${prev === tgt ? " = Vorjahr" : ""}</div></div>
        ${pred ? `<div class="pin me" style="left:${pos(pred)}%"><div class="lab"><b>${race.prediction.time}</b>Du jetzt</div></div>` : ""}
      </div>
      <div class="muted" style="margin-top:4px">${pred ? (race.gap_sec <= 0 ? `🔥 Auf Kurs, ${Math.round(-race.gap_sec)} s Puffer` : `Noch ${fmtS(race.gap_sec)} min schneller werden`) : "Deine Prognose erscheint nach dem ersten harten Lauf (5-km-Test am 12.12.)."}</div>
      ${D.races.slice(1).map(r => `<div class="row between muted" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"><span>🎯 ${esc(r.name)}</span><span class="num">${r.days_left} Tage · ${r.target}</span></div>`).join("")}
    </section>`;
  }

  h += milestones(D);

  // rings + week strip
  const R = [[w.planned ? w.done / w.planned : 0, "var(--run)", "var(--run2)", "Einheiten", `${w.done}/${w.planned || "–"}`, "vom Wochenplan"],
    [w.strength / (w.strength_target || 2), "var(--strength)", "var(--strength2)", "Kraft", `${w.strength}/${w.strength_target}`, "Einheiten"],
    [w.intensity_min / (w.intensity_target || 150), "var(--racket)", "var(--bike2)", "Intensität", `${w.intensity_min}/${w.intensity_target}`, "Minuten (WHO-Ziel)"]];
  h += `<section class="card"><div class="lbl">Diese Woche</div><div class="rings">
    <svg viewBox="0 0 150 150">${R.map((x, i) => ring(75, 64 - i * 19, 15, x[0], x[1], x[2], x[3])).join("")}</svg>
    <div class="leg">${R.map(x => `<div><span style="background:${x[1]};box-shadow:0 0 8px ${x[1]}"></span><b class="num">${x[4]}</b><small>${x[3]} · ${x[5]}</small></div>`).join("")}</div></div>
    <div class="days">${w.days.map(d => { const mx = Math.max(60, ...w.days.map(z => z.min)); const sp = d.sports[0];
      const plannedOnly = !d.min && d.planned.length;
      return `<div class="day${d.day === D.today ? " today" : ""}">${WD[D_(d.day).getDay()]}<div class="b">
        <i data-h="${d.min / mx * 100}" style="background:linear-gradient(0deg, ${sp ? SP[sp].c : "transparent"}, ${sp ? SP[sp].c2 : "transparent"})"></i>
        <em>${d.sports.map(s => SP[s].i).join("") || (plannedOnly ? `<span style="opacity:.35">${SP[d.planned[0]]?.i || ""}</span>` : "")}</em></div></div>`; }).join("")}</div>
  </section>`;

  // readiness + streak
  h += `<section class="grid2">
    <div class="card" style="text-align:center"><div class="lbl" style="text-align:left">Heute</div>${gauge(D.readiness, A[0])}
      <div style="font-weight:800;color:${A[0]};margin-top:6px">${A[1]}</div><div class="muted" style="font-size:12.5px">${A[2]}</div></div>
    <div class="card"><div class="lbl">Serie</div><div class="row"><span class="flame">🔥</span><div><div class="big num">${cnt(D.streak_weeks)}</div><div class="muted">Wochen</div></div></div>

      <div class="muted" style="font-size:12px;margin-top:8px">Rekord ${D.streak_best} · Plantreue ${D.adherence_pct ?? "–"} %</div></div>
  </section>`;
  if (D.flags.length) h += `<section class="card" style="padding:12px 16px">${D.flags.map(f => `<div class="flag">⚠️ ${esc(f)}</div>`).join("")}</section>`;

  // next sessions
  h += `<section class="card"><div class="lbl">Als Nächstes</div><div class="scroller">${D.next.length ? D.next.map(p => `
    <div class="sess g-${SP[p.sport] ? p.sport : "other"}"><span class="when">${p.date === D.today ? "HEUTE" : p.status === "late" ? "NACHHOLEN" : wdd(p.date)}</span>
      <div class="ic">${SP[p.sport]?.i || "✨"}</div><h3>${esc(p.name)}</h3><p>${esc(p.description || "")}</p></div>`).join("")
    : `<div class="muted">Kein Plan hinterlegt.</div>`}</div></section>`;

  // badges
  const bs = D.badges.slice().sort((a, b) => (b.achieved - a.achieved) || (b.progress - a.progress));
  h += `<section class="card"><div class="lbl">Erfolge · ${D.badges.filter(b => b.achieved).length}/${D.badges.length}</div><div class="badges">${bs.map(b => {
    const C = 2 * Math.PI * 24;
    return `<div class="badge ${b.achieved ? "got" : "lock"}"><div class="ico"><svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="24" fill="none" stroke="var(--line)" stroke-width="4"/>
      <circle cx="27" cy="27" r="24" fill="none" stroke="${b.achieved ? "var(--yellow)" : "var(--run)"}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-to="${C * (1 - b.progress)}" transform="rotate(-90 27 27)"/></svg><span>${b.icon}</span></div>
      <b>${esc(b.title)}</b><small>${b.achieved ? "geschafft" : b.value != null ? `${b.value} bisher` : `${Math.round(b.progress * 100)} %`}</small></div>`; }).join("")}</div></section>`;
  return h;
}

function tTraining(D) {

      ${bars(D.weeks, "run_km", "var(--run)", "var(--run2)", w.run_km_avg4)}

      <div class="rec"><small>Meiste km / Woche</small><b class="num">${rc.best_week_km ? nf(rc.best_week_km.km, 1) : "–"}</b><small>${rc.best_week_km ? "Woche ab " + dd(rc.best_week_km.week) : ""}</small></div>
      <div class="rec"><small>Meiste Einheiten / Woche</small><b class="num">${rc.most_sessions ? rc.most_sessions.n : "–"}</b><small>${rc.most_sessions ? "Woche ab " + dd(rc.most_sessions.week) : ""}</small></div>
    </div></section>

    <section class="card"><div class="lbl">Plantreue je Woche</div>

  const ST = { done: ["✓", "var(--green)"], missed: ["✕", "var(--red)"], late: ["…", "var(--yellow)"], today: ["●", "var(--run)"] };
  const plan = D.plan.filter(p => p.status !== "upcoming").slice(-12).reverse();
  if (plan.length) h += `<section class="card"><div class="lbl">Plan bisher</div>${plan.map(p => `<div class="pl"><span class="st" style="background:color-mix(in srgb, ${ST[p.status][1]} 20%, transparent);color:${ST[p.status][1]}">${ST[p.status][0]}</span>
      <span style="flex:1">${SP[p.sport]?.i || ""} ${esc(p.name)}</span><span class="muted">${wdd(p.date)}</span></div>`).join("")}</section>`;
  h += `<section class="card"><div class="lbl">Letzte Aktivitäten</div><table><tr><th>Tag</th><th></th><th>km</th><th>Zeit</th><th>Pace</th><th>Puls</th></tr>
    ${D.recent.map(a => `<tr><td>${wdd(a.day)}</td><td>${SP[a.sport].i}</td><td class="num">${a.km ? nf(a.km, 1) : "–"}</td><td class="num">${Math.round(a.min)}′</td>
      <td class="num">${a.sport === "running" && a.km ? fmtS(a.min * 60 / a.km) : "–"}</td><td class="num">${a.hr ? Math.round(a.hr) : "–"}</td></tr>`).join("")}</table>
    <p class="note">Prognose nach Riegel (1981): Zeit × (Distanzverhältnis)<sup>1,06</sup>, nur aus harten Läufen (Ø-Puls ab 170) der letzten 8 Wochen.</p></section>`;
  return h;
}

function tErholung(D) {
  const R = D.recovery, A = AMP[D.ampel] || AMP.grau;
  const blk = (k, color, fmt, unit) => { const r = R[k]; const d = r.avg_7d != null && r.avg_28d != null ? r.avg_7d - r.avg_28d : null;
    const good = d == null ? null : (r.good === "up" ? d >= 0 : d <= 0);
    const f = v => fmt === "hm" ? hm(v) : nf(v);
    return `<section class="card"><div class="row between"><div class="lbl" style="margin:0">${r.label}</div>${d != null ? `<span class="delta ${good ? "up" : "dn"}">${d > 0 ? "▲" : "▼"} ${fmt === "hm" ? Math.round(Math.abs(d)) + " min" : nf(Math.abs(d), 1)} vs. 28 T</span>` : ""}</div>
      <div class="kpi" style="margin-top:10px"><div><b class="num">${f(r.latest)}<span class="muted" style="font-size:14px"> ${unit}</span></b><small>zuletzt</small></div>
      <div><b class="num" style="font-size:18px">${f(r.avg_7d)}</b><small>Ø 7 Tage</small></div><div><b class="num" style="font-size:18px">${f(r.avg_28d)}</b><small>Ø 28 Tage</small></div></div>
      ${area(r.series, { color, band: k === "hrv_last_night" ? r.baseline : null, fmt, h: 100 })}</section>`; };
  return `<header class="hdr"><h1>Erholung</h1></header>
    <section class="card"><div class="row"><div style="width:120px">${gauge(D.readiness, A[0])}</div><div><div style="font-size:22px;font-weight:800;color:${A[0]}">${A[1]}</div><div class="muted">${A[2]}</div></div></div>
      ${D.flags.map(f => `<div class="flag">⚠️ ${esc(f)}</div>`).join("")}</section>
    ${blk("hrv_last_night", "var(--racket)", "", "ms")}${blk("resting_hr", "var(--red)", "", "bpm")}${blk("sleep_min", "var(--strength)", "hm", "h")}${blk("body_battery_high", "var(--bike)", "", "")}
    <p class="note" style="padding:0 4px">Grünes Band = dein HRV-Normalbereich laut Garmin. Hart trainieren an guten HRV-Tagen und locker an schlechten brachte in Studien mehr Fortschritt als ein starrer Plan (Kiviniemi et al. 2007, Eur J Appl Physiol 101:743). Gelb ab einem Warnsignal: Ruhepuls ≥ 5 über 28-Tage-Schnitt, HRV unter Normalbereich, unter 6 h Schlaf oder Body Battery unter 50.</p>`;
}

function tKoerper(D) {
  const B = D.body, pr = B.protein_target ? B.protein_7d / B.protein_target : 0;
  const C = 2 * Math.PI * 44;
  return `<header class="hdr"><h1>Körper</h1></header>
    <section class="card"><div class="lbl">Gewicht · 7-Tage-Schnitt</div>
      <div class="kpi"><div><b class="num">${cnt(B.weight_now, 1)} kg</b><small>aktuell</small></div>
      <div><b class="num" style="font-size:18px">${B.weight_change_4w == null ? "–" : (B.weight_change_4w > 0 ? "+" : "") + nf(B.weight_change_4w, 1) + " kg"}</b><small>in 4 Wochen</small></div></div>
      ${area(B.weight, { color: "var(--strength)", trend: B.weight_avg, fmt: "1", h: 130 })}
      <p class="note">${B.last_weigh ? `Zuletzt gewogen ${wdd(B.last_weigh)}` : "Noch keine Gewichtsdaten."} Tageswerte schwanken um 1–2 kg durch Wasser, zählen tut die Linie. Für Muskelaufbau langsam zunehmen, etwa 0,25–0,5 % des Körpergewichts pro Woche (Iraki et al. 2019, Sports 7:154).</p></section>
    <section class="card"><div class="lbl">Protein · Ø 7 Tage</div><div class="row" style="gap:18px">
      <svg viewBox="0 0 110 110" style="width:110px;flex:none"><circle cx="55" cy="55" r="44" fill="none" stroke="var(--line)" stroke-width="12"/>
        <circle cx="55" cy="55" r="44" fill="none" stroke="var(--racket)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-to="${C * (1 - Math.min(pr, 1))}" transform="rotate(-90 55 55)" style="filter:drop-shadow(0 0 6px var(--racket))"/>
        <text x="55" y="60" text-anchor="middle" style="font-size:20px;font-weight:800;fill:var(--ink)">${B.protein_7d != null ? Math.round(pr * 100) + "%" : "–"}</text></svg>
      <div><div class="big num" style="font-size:34px">${B.protein_7d != null ? cnt(B.protein_7d) : "–"}<span class="muted" style="font-size:16px"> / ${B.protein_target ?? "–"} g</span></div>
      <div class="muted">${B.kcal_7d ? `Ø ${nf(B.kcal_7d)} kcal pro Tag` : "Keine Yazio-Daten in den letzten 7 Tagen. Tracken lohnt sich!"}</div></div></div>
      <p class="note">Ziel ${nf(B.protein_g_per_kg, 1)} g pro kg Körpergewicht. Darüber bringt es im Schnitt kaum zusätzlichen Muskelzuwachs (Morton et al. 2018, BJSM 52:376).</p></section>`;
}

/* ---------- app ---------- */
let DATA = null, TAB = "heute";
try { TAB = localStorage.getItem("tab") || "heute"; } catch (e) {}
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

function render(D, stale) {
  DATA = D;
  const app = document.getElementById("app");
  app.innerHTML = (stale ? `<div class="err">NAS nicht erreichbar, zeige den letzten Stand.</div>` : "") +
    [["heute", tHeute], ["ziele", tZiele], ["training", tTraining], ["erholung", tErholung], ["koerper", tKoerper]]
      .map(([k, f]) => `<div class="tab${k === TAB ? " on" : ""}" id="t-${k}">${f(D)}</div>`).join("") +
    `<div class="foot">Stand ${D.generated_at.replace("T", ", ")} · Daten bis ${D.latest_day ? wdd(D.latest_day) : "–"} · <a href="#" id="reload">neu laden</a></div>`;
  activate(TAB, true);
  document.getElementById("reload").onclick = e => { e.preventDefault(); load(); };
  document.getElementById("theme").onclick = () => {
    const r = document.documentElement, t = r.dataset.theme === "light" ? "dark" : "light"; r.dataset.theme = t;
    try { localStorage.setItem("theme", t); } catch (e) {}
  };
}
function activate(k, first) {
  TAB = k; try { localStorage.setItem("tab", k); } catch (e) {}
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.id === "t-" + k));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === k));
  const t = document.getElementById("t-" + k); if (!t) return;
  t.querySelectorAll("circle[data-to]").forEach(c => c.style.strokeDashoffset = c.getAttribute("stroke-dashoffset"));
  t.querySelectorAll(".card").forEach(c => { c.style.animation = "none"; c.offsetHeight; c.style.animation = ""; });
  t.querySelectorAll(".draw,.grow,.fade").forEach(el => { el.style.animation = "none"; el.getBoundingClientRect(); el.style.animation = ""; });
  animateRings(t); countUp(t); bindCharts(t);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    t.querySelectorAll(".track i, .ms .pb i").forEach(i => i.style.width = i.dataset.w + "%");
    t.querySelectorAll(".day .b i").forEach(i => i.style.height = i.dataset.h + "%");
  }));
  if (!first) window.scrollTo({ top: 0, behavior: "smooth" });
}
document.getElementById("nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b && DATA) activate(b.dataset.t); });

async function load() {
  try {
    const r = await fetch("api/dashboard.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const D = await r.json();
    try { localStorage.setItem("dash", JSON.stringify(D)); } catch (e) {}
    render(D);
  } catch (e) {
    let c = null; try { c = JSON.parse(localStorage.getItem("dash")); } catch (_) {}
    if (c) render(c, true);
    else document.getElementById("app").innerHTML = `<div class="err">NAS nicht erreichbar (${esc(e.message)}). Bist du im WLAN zu Hause?</div>`;
  }
}
load();
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
