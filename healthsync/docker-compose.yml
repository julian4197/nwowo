services:
  healthsync:
    build: .
    container_name: healthsync
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Berlin
      RCLONE_CONFIG: /data/rclone.conf
    ports:
      - "8085:8085"   # Empfang für Health Auto Export (nur im Heimnetz nutzen)
    volumes:
      - ./data:/data
